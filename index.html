  <div class="app">

      <p class="brand">Claude Engineering Lab</p>
      <div class="header-xp" id="header-xp">
        <span class="xp-label" id="xp-label">XP 0 / 500</span>
      </div>
      <div class="header-controls" id="header-controls">
        <button type="button" class="btn menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="rail">Menu</button>

    </header>

      <ul id="rail-list">
        <li><a href="#/">Home</a></li>

    </main>

    <aside class="system" id="system" aria-label="Your System">
      <h2>Your System</h2>
      <p>Your diagram grows as you complete missions.</p>
    </aside>

    <section class="coach" aria-label="Coach">
      <p class="coach-title">Coach</p>
      <div class="coach-body" id="coach" aria-live="polite" aria-atomic="true"></div>
      <div class="coach-tools" id="coach-tools"></div>
      <div class="coach-nav" id="coach-nav"></div>
