name: CI

on:
  pull_request:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  sast:
    name: Static Analysis (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@883d8588e56d1753a8a58c1c86e88976f0c23449 # v3.26.3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@883d8588e56d1753a8a58c1c86e88976f0c23449 # v3.26.3

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      - name: Secret scan with gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Check no dependency manifests exist
        run: |
          if [ -f package-lock.json ] || [ -f poetry.lock ]; then
            echo "ERROR: Dependency manifest found. This project must not have dependencies (spec SEC-12)."
            exit 1
          fi
          echo "✓ No dependency manifests found"

  brand-and-code:
    name: Brand Compliance & Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.x'

      - name: Run static checks
        run: |
          python tools/static-checks.py
        continue-on-error: false

      - name: Syntax-check every JavaScript file
        run: |
          for f in $(find js tests -name '*.js'); do node --check "$f" || exit 1; done

  tests:
    name: Browser Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Run tests.html in headless Chrome
        run: |
          google-chrome --headless --disable-gpu --no-sandbox --virtual-time-budget=10000 --dump-dom "file://$PWD/tests.html" > tests-dom.html
          grep -E "^(PASS|FAIL) |RESULT:" tests-dom.html
          grep -q "RESULT: PASS" tests-dom.html

  lint-pr:
    name: PR Metadata Check
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR requirements
        run: |
          if [ -z "${{ github.event.pull_request.title }}" ]; then
            echo "ERROR: PR title is required"
            exit 1
          fi
          echo "✓ PR title present: ${{ github.event.pull_request.title }}"
